# SwiftLint Configuration for PHR_Project

disabled_rules:
  - closure_parameter_position          # Team convention differs from default
  - opening_brace                       # Team convention differs from default
  - trailing_whitespace                 # Cosmetic; handled by Xcode's trimming
  - vertical_whitespace                 # Cosmetic
  - comment_spacing                     # Cosmetic
  - trailing_comma                      # Team preference
  - multiple_closures_with_trailing_closure # Preference
  - statement_position                  # Team convention
  - for_where                           # Preference
  - unneeded_override                   # Low-risk
  - mark                                # Cosmetic
  - trailing_newline                    # Cosmetic
  - large_tuple                         # Architectural: would need refactoring

opt_in_rules: []

# Relaxed thresholds to match the actual codebase
line_length:
  warning: 200
  error: 300
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 120
  error: 200

file_length:
  warning: 600
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 25

function_parameter_count:
  warning: 8
  error: 10

identifier_name:
  min_length:
    warning: 3
    error: 2          # Allow 2-char names as warning only, not error
  max_length:
    warning: 40
    error: 60
  excluded:
    - id
    - ok
    - vc
    - sv
    - tz
    - dx
    - dy
    - pi
    - db

type_name:
  min_length: 3
  max_length: 50
